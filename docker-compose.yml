name: studeo

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: studeo
      POSTGRES_USER: studeo
      POSTGRES_PASSWORD: studeo_dev   # local development only
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - studeo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studeo -d studeo"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Auth provider (OIDC). Admin console: http://localhost:8180/admin (admin / admin, local development only).
  # The "studeo" realm (roles teacher/student, clients studeo-ui and studeo-api) is imported from keycloak/ on first start.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin   # local development only
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - studeo-keycloak:/opt/keycloak/data

volumes:
  studeo-db:
  studeo-keycloak:
